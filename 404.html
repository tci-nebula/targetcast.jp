<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | 株式会社ターゲットキャスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@300&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#EFF1F0;color:#16191A;
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:300;line-height:1.9;}
  .box{max-width:520px;padding:40px 24px;}
  .code{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.26em;
    text-transform:uppercase;color:#14514A;margin:0 0 26px;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:28px;
    letter-spacing:.05em;margin:0 0 16px;}
  p{margin:0 0 28px;}
  a{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:#14514A;text-decoration:none;
    border-bottom:1px solid #CDD3D1;padding-bottom:3px;}
  a:hover{border-bottom-color:#14514A;}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404 — not found</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>The page you're looking for isn't here.</p>
    <a href="/">トップへ戻る / Back to home</a>
  </div>
</body>
</html>
