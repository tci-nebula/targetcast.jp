name = "targetcast-enquiry-relay"
main = "enquiry-relay.js"
compatibility_date = "2026-08-28"

routes = [
  { pattern = "forms.targetcast.jp/enquiry", custom_domain = true }
]

# Optional per-IP rate limiting. Create the namespace, then paste its id here:
#   wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste-namespace-id>"

# Secret (never commit it):
#   wrangler secret put ROCKETCHAT_WEBHOOK
