name = "targetcast-enquiry-relay"
main = "enquiry-relay.js"
compatibility_date = "2026-08-28"

# The destination channel is decided solely by the webhook integration binding
# in Rocket.Chat (must be #targetcast, never MAN.W). The server rejects any
# payload that names a channel, so there is no CHANNEL var — a re-pointed
# webhook fails loudly instead of posting somewhere unexpected.

# Custom domain needs the targetcast.jp zone active on Cloudflare, which is
# blocked on the registrar pushing the NS change to JPRS. Until then the worker
# serves on workers.dev (the default with no routes); switch back to the route
# once the delegation lands, and update ENDPOINT in index.html to match.
# routes = [
#   { pattern = "forms.targetcast.jp/enquiry", custom_domain = true }
# ]

# Optional per-IP rate limiting. Create the namespace, then paste its id here:
#   wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste-namespace-id>"

# Secret (never commit it). Use the incoming webhook created against #targetcast,
# not the MAN.W one:
#   wrangler secret put ROCKETCHAT_WEBHOOK
